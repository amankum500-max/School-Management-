<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #3b82f6 100%);
            min-height: 100vh; display: flex;
            align-items: center; justify-content: center;
            padding: 1rem; color: white;
        }
        .box { text-align: center; max-width: 450px; }
        h1 { font-size: 5rem; font-weight: 800; line-height: 1; margin-bottom: 0.5rem; }
        h2 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.75rem; }
        p { opacity: 0.85; margin-bottom: 1.5rem; font-size: 0.95rem; line-height: 1.6; }
        a {
            display: inline-block; padding: 0.7rem 1.5rem;
            background: white; color: #1e293b; text-decoration: none;
            border-radius: 8px; font-weight: 700; font-size: 0.9rem;
            margin: 0 0.25rem;
        }
        a:hover { transform: translateY(-1px); }
    </style>
</head>
<body>
    <div class="box">
        <h1>404</h1>
        <h2>Page not found</h2>
        <p>Ye page exist nahi karta, ya aap galat URL pe aa gaye ho.</p>
        <a href="javascript:history.back()" style="background:rgba(255,255,255,0.2); color:white;">← Back</a>
        <a href="/">Home</a>
    </div>
</body>
</html>
