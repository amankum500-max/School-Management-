<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 — Access Denied</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: system-ui, sans-serif;
            background: linear-gradient(135deg, #92400e 0%, #f59e0b 100%);
            min-height: 100vh; display: flex;
            align-items: center; justify-content: center;
            padding: 1rem; color: white;
        }
        .box { text-align: center; max-width: 450px; }
        h1 { font-size: 5rem; font-weight: 800; line-height: 1; margin-bottom: 0.5rem; }
        h2 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.75rem; }
        p { opacity: 0.9; margin-bottom: 1.5rem; font-size: 0.95rem; }
        a {
            display: inline-block; padding: 0.7rem 1.5rem;
            background: white; color: #92400e; text-decoration: none;
            border-radius: 8px; font-weight: 700; font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>403</h1>
        <h2>Access denied</h2>
        <p>Aapko is page ka access nahi hai. Login karo ya admin se sampark karo.</p>
        <a href="/">← Go Home</a>
    </div>
</body>
</html>
