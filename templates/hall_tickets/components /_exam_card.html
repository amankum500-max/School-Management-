<div class="bg-[#111] border border-[#00ffcc]/30 p-5 rounded-lg shadow-lg hover:border-[#00ffcc] transition">
    <!-- Exam Name -->
    <h3 class="text-xl font-bold text-white mb-2">{{ exam.name }}</h3>
    
    <!-- Exam Details -->
    <div class="text-gray-400 text-sm mb-4">
        <p><strong>Class:</strong> {{ exam.class_name }}</p>
        <p><strong>Date:</strong> {{ exam.exam_date }}</p>
        <p><strong>Max Marks:</strong> {{ exam.max_marks }}</p>
    </div>
    
    <!-- Action Button -->
    <div class="mt-4">
        <a href="{{ url_for('hall_tickets.manage', exam_id=exam.id) }}" class="bg-[#00ffcc] text-black px-4 py-2 rounded font-bold text-sm hover:bg-[#00ccaa]">
            Manage Seating
        </a>
    </div>
</div>
