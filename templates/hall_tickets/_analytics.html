<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard</title>
    <!-- Chart.js CDN (ग्राफ दिखाने के लिए) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .dashboard-container {
            max-width: 900px;
            margin: 0 auto;
        }
        /* ऊपर के 3 कार्ड्स की स्टाइलिंग */
        .stats-grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            flex: 1;
            min-width: 200px;
            border-left: 4px solid #4e73df; /* नीला बॉर्डर */
        }
        .stat-title {
            font-size: 13px;
            color: #6c757d;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #2e59d9;
        }
        /* चार्ट की स्टाइलिंग */
        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .chart-title {
            margin-top: 0;
            color: #333;
            font-size: 18px;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .chart-wrapper {
            width: 100%;
            height: 300px; /* चार्ट की ऊंचाई */
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- स्टैट्स कार्ड्स -->
        <div class="stats-grid">
            <!-- Total Exams -->
            <div class="stat-card">
                <div class="stat-title">Total Exams</div>
                <div class="stat-value">{{ stats.total_exams if stats else '0' }}</div>
            </div>
            
            <!-- Tickets Generated -->
            <div class="stat-card">
                <div class="stat-title">Tickets Generated</div>
                <div class="stat-value">{{ stats.total_tickets if stats else '0' }}</div>
            </div>
            
            <!-- Tickets Printed -->
            <div class="stat-card">
                <div class="stat-title">Tickets Printed</div>
                <div class="stat-value">{{ stats.printed_tickets if stats else '0' }}</div>
            </div>
        </div>

        <!-- चार्ट सेक्शन -->
        <div class="chart-container">
            <h2 class="chart-title">Ticket Stats Overview</h2>
            <div class="chart-wrapper">
                <canvas id="ticketStatsChart"></canvas>
            </div>
        </div>
    </div>

    <!-- चार्ट को रेंडर करने का जावास्क्रिप्ट कोड -->
    <script>
        // Jinja से डेटा लेना और उसे integer में बदलना
        // अगर stats नहीं है, तो 0 लिया जाएगा
        const generatedTickets = parseInt("{{ stats.total_tickets if stats else 0 }}");
        const printedTickets = parseInt("{{ stats.printed_tickets if stats else 0 }}");

        const ctx = document.getElementById('ticketStatsChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar', // आप इसे 'pie' या 'line' भी कर सकते हैं
            data: {
                labels: ['Tickets Generated', 'Tickets Printed'],
                datasets: [{
                    label: 'Number of Tickets',
                    data: [generatedTickets, printedTickets],
                    backgroundColor: [
                        'rgba(78, 115, 223, 0.7)', // नीला (Generated)
                        'rgba(28, 200, 138, 0.7)'  // हरा (Printed)
                    ],
                    borderColor: [
                        'rgba(78, 115, 223, 1)',
                        'rgba(28, 200, 138, 1)'
                    ],
                    borderWidth: 1,
                    borderRadius: 5
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            stepSize: 1 // सिर्फ पूर्णांक (whole numbers) दिखाने के लिए
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: false // ऊपर वाला लेबल छिपाने के लिए
                    }
                }
            }
        });
    </script>
</body>
</html>
