{% extends "base.html" %}
{% block content %}
<div class="bg-[#0a0a0a] min-h-screen p-8 text-[#00ffcc]">
    <h1 class="text-2xl">NEXUS PDF GENERATOR</h1>
    
    <!-- Web3 Connect -->
    <button onclick="connectWallet()" class="border border-[#00ffcc] p-2 mt-4">Connect MetaMask</button>
    
    <!-- Progress Bar -->
    <div class="w-full bg-gray-800 h-4 mt-8 rounded">
        <div id="progressBar" class="bg-[#00ffcc] h-4 rounded" style="width: 0%"></div>
    </div>
    
    <!-- Terminal Logs -->
    <div id="logs" class="bg-black p-4 h-64 overflow-y-auto mt-4 border border-[#00ffcc]/30 font-mono text-xs">
        > Awaiting Command...
    </div>
</div>
{% endblock %}
