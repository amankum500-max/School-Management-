<!DOCTYPE html>
<html>
<head>
    <title>Hall Ticket - {{ student.name }}</title>
    <style>
        /* Pure A4 Print CSS */
        body { font-family: Arial, sans-serif; background: white; color: black; }
        .ticket-box { border: 2px solid black; width: 100%; max-width: 800px; margin: auto; padding: 20px; }
        .qr-code { width: 100px; height: 100px; }
    </style>
</head>
<body onload="window.print()">
    <div class="ticket-box">
        <h2>School Name</h2>
        <h3>Hall Ticket</h3>
        <p>Student: {{ student.name }}</p>
        <!-- QR aur Barcode yahan aayega -->
    </div>
</body>
</html>
