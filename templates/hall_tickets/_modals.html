<!-- Print Confirmation Modal -->
<div id="printConfirmationModal" class="ht-custom-modal" role="dialog" aria-modal="true" aria-labelledby="htModalTitle">
    <div class="ht-modal-content">
        <div class="ht-modal-header">
            <h3 id="htModalTitle">Confirm Print</h3>
            <button type="button" class="ht-close-btn" onclick="closeModal()" aria-label="Close">&times;</button>
        </div>
        <div class="ht-modal-body">
            <p id="htPrintConfirmText">Are you sure you want to print this hall ticket?</p>
        </div>
        <div class="ht-modal-footer">
            <button type="button" class="ht-btn ht-btn-cancel" onclick="closeModal()">Cancel</button>
            <button type="button" class="ht-btn ht-btn-print" onclick="triggerPrint()">Print</button>
        </div>
    </div>
</div>

<style>
    .ht-custom-modal {
        display: none;
        position: fixed;
        z-index: 1050;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.55);
        align-items: center;
        justify-content: center;
        padding: 16px;
    }

    .ht-modal-content {
        background-color: #ffffff;
        width: 100%;
        max-width: 400px;
        border-radius: 10px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        overflow: hidden;
        animation: htFadeIn 0.2s ease-out;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .ht-modal-header {
        background-color: #f8f9fc;
        padding: 14px 18px;
        border-bottom: 1px solid #e3e6f0;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .ht-modal-header h3 {
        margin: 0;
        font-size: 17px;
        color: #1e293b;
        font-weight: 700;
    }

    .ht-close-btn {
        background: transparent;
        border: none;
        font-size: 24px;
        line-height: 1;
        font-weight: bold;
        color: #64748b;
        cursor: pointer;
        padding: 0 4px;
    }

    .ht-close-btn:hover {
        color: #0f172a;
    }

    .ht-modal-body {
        padding: 20px;
        font-size: 15px;
        color: #475569;
        text-align: center;
    }

    .ht-modal-body p {
        margin: 0;
    }

    .ht-modal-footer {
        padding: 12px 18px;
        background-color: #f8f9fc;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        border-top: 1px solid #e3e6f0;
    }

    .ht-btn {
        padding: 8px 16px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
        font-weight: 600;
    }

    .ht-btn-cancel {
        background-color: #e2e8f0;
        color: #334155;
    }

    .ht-btn-cancel:hover {
        background-color: #cbd5e1;
    }

    .ht-btn-print {
        background-color: #4e73df;
        color: #ffffff;
    }

    .ht-btn-print:hover {
        background-color: #2e59d9;
    }

    @keyframes htFadeIn {
        from { opacity: 0; transform: translateY(-14px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @media print {
        .ht-custom-modal,
        #printConfirmationModal {
            display: none !important;
        }
    }
</style>

<script>
    function openModal(customMessage) {
        const modal = document.getElementById('printConfirmationModal');
        const textEl = document.getElementById('htPrintConfirmText');
        if (!modal) return;

        if (textEl) {
            textEl.textContent = customMessage || 'Are you sure you want to print this hall ticket?';
        }
        modal.style.display = 'flex';
    }

    function closeModal() {
        const modal = document.getElementById('printConfirmationModal');
        if (modal) {
            modal.style.display = 'none';
        }
    }

    function triggerPrint() {
        closeModal();
        setTimeout(function () {
            window.print();
        }, 80);
    }

    document.addEventListener('click', function (e) {
        const modal = document.getElementById('printConfirmationModal');
        if (modal && e.target === modal) {
            closeModal();
        }
    });

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
            closeModal();
        }
    });
</script>
