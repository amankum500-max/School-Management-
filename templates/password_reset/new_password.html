<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Password</title>
    <style>
        body { font-family:system-ui,sans-serif; min-height:100vh;
            background:linear-gradient(135deg,#1e293b,#3b82f6);
            display:flex; align-items:center; justify-content:center; padding:1rem;
            margin:0; }
        .card { background:white; padding:2rem; border-radius:14px;
            width:100%; max-width:400px; box-shadow:0 20px 50px rgba(0,0,0,0.2); }
        h1 { font-size:1.4rem; margin-bottom:0.25rem; color:#1e293b; }
        label { display:block; font-size:0.85rem; color:#334155;
            margin-bottom:0.35rem; font-weight:500; margin-top:0.75rem; }
        input { width:100%; padding:0.65rem; border:1px solid #cbd5e1;
            border-radius:8px; font-size:0.95rem; }
        button { width:100%; padding:0.75rem; background:#10b981; color:white;
            border:none; border-radius:8px; font-size:0.95rem; font-weight:600;
            cursor:pointer; margin-top:1rem; }
        .flash { padding:0.65rem; border-radius:6px; font-size:0.85rem;
            margin-bottom:1rem; }
        .flash.error { background:#fee2e2; color:#991b1b; }
        .flash.success { background:#d1fae5; color:#065f46; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔑 New Password</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for cat, msg in messages %}
            <div class="flash {{ cat }}" style="margin-top:0.75rem;">{{ msg }}</div>
            {% endfor %}
        {% endwith %}
        <form method="POST">
            <label>New Password</label>
            <input name="new_password" type="password" required minlength="6">

            <label>Confirm Password</label>
            <input name="confirm_password" type="password" required minlength="6">

            <button type="submit">Reset Password</button>
        </form>
    </div>
</body>
</html>
