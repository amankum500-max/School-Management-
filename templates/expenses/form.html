{% extends "base.html" %}
{% block title %}{{ 'Add' if mode=='add' else 'Edit' }} Expense{% endblock %}
{% block page_title %}{{ 'New' if mode=='add' else 'Edit' }} Expense{% endblock %}

{% block content %}
<div class="card" style="max-width:600px;">
<form method="POST">

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:1rem;">
        <div>
            <label style="font-size:0.85rem; color:#334155;">Category *</label>
            <select name="category" required
                style="width:100%; padding:0.6rem; border:1px solid #cbd5e1; border-radius:6px;">
                <option value="">Select</option>
                {% for c in categories %}
                <option value="{{ c }}" {% if expense and expense.category == c %}selected{% endif %}>
                    {{ c }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label style="font-size:0.85rem; color:#334155;">Amount (₹) *</label>
            <input name="amount" type="number" step="0.01" required
                value="{{ expense.amount if expense else '' }}"
                style="width:100%; padding:0.6rem; border:1px solid #cbd5e1; border-radius:6px;">
        </div>
    </div>

    <div style="margin-bottom:1rem;">
        <label style="font-size:0.85rem; color:#334155;">Description</label>
        <input name="description" value="{{ expense.description if expense else '' }}"
            placeholder="e.g. Classroom furniture repair"
            style="width:100%; padding:0.6rem; border:1px solid #cbd5e1; border-radius:6px;">
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:1rem;">
        <div>
            <label style="font-size:0.85rem; color:#334155;">Date</label>
            <input name="expense_date" type="date" value="{{ today }}"
                style="width:100%; padding:0.6rem; border:1px solid #cbd5e1; border-radius:6px;">
        </div>
        <div>
            <label style="font-size:0.85rem; color:#334155;">Payment Mode</label>
            <select name="payment_mode"
                style="width:100%; padding:0.6rem; border:1px solid #cbd5e1; border-radius:6px;">
                {% for m in ['cash','upi','cheque','bank'] %}
                <option value="{{ m }}" {% if expense and expense.payment_mode == m %}selected{% endif %}>
                    {{ m|capitalize }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label style="font-size:0.85rem; color:#334155;">Vendor</label>
            <input name="vendor" value="{{ expense.vendor if expense else '' }}"
                style="width:100%; padding:0.6rem; border:1px solid #cbd5e1; border-radius:6px;">
        </div>
        <div>
            <label style="font-size:0.85rem; color:#334155;">Receipt No</label>
            <input name="receipt_no" value="{{ expense.receipt_no if expense else '' }}"
                style="width:100%; padding:0.6rem; border:1px solid #cbd5e1; border-radius:6px;">
        </div>
    </div>

    <div style="margin-bottom:1rem;">
        <label style="font-size:0.85rem; color:#334155;">Note</label>
        <textarea name="note" rows="2"
            style="width:100%; padding:0.6rem; border:1px solid #cbd5e1; border-radius:6px;">{{ expense.note if expense else '' }}</textarea>
    </div>

    <div style="display:flex; gap:0.75rem;">
        <button type="submit" class="btn">{{ 'Create' if mode=='add' else 'Save' }}</button>
        <a href="{{ url_for('expenses.index') }}"
           style="padding:0.6rem 1.1rem; color:#64748b; text-decoration:none;">Cancel</a>
    </div>
</form>
</div>
{% endblock %}
