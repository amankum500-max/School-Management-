{% extends "public/base.html" %}
{% block title %}Enquiry Received{% endblock %}

{% block content %}
<div class="container" style="max-width:600px; text-align:center; padding-top:3rem;">
    <div style="font-size:3.5rem; margin-bottom:1rem;">✅</div>
    <h1 style="font-size:1.5rem; margin-bottom:0.75rem; color:#10b981;">
        Enquiry Received!
    </h1>
    <p style="color:#475569; font-size:0.95rem; margin-bottom:0.5rem;">
        Thank you for your interest in {{ school.school_name }}.
    </p>
    <p style="color:#64748b; font-size:0.85rem; margin-bottom:2rem;">
        Reference ID: <strong>#{{ enquiry_id }}</strong><br>
        Our team will contact you within 2-3 working days.
    </p>
    <a href="{{ url_for('public_site.home') }}"
       style="display:inline-block; background:#3b82f6; color:white;
       padding:0.65rem 1.5rem; border-radius:6px; text-decoration:none;
       font-weight:600; font-size:0.9rem;">
        ← Back to Home
    </a>
</div>
{% endblock %}
