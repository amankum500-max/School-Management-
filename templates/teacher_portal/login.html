<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Login</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: system-ui, sans-serif; min-height:100vh;
            background: linear-gradient(135deg, #1e293b 0%, #3b82f6 100%);
            display: flex; align-items:center; justify-content:center; padding:1rem;
        }
        .card {
            background:white; padding:2rem; border-radius:14px;
            width:100%; max-width:380px; box-shadow:0 20px 50px rgba(0,0,0,0.2);
        }
        h1 { font-size:1.4rem; margin-bottom:0.25rem; color:#1e293b; }
        p.sub { color:#64748b; font-size:0.88rem; margin-bottom:1.5rem; }
        label { display:block; font-size:0.85rem; color:#334155; margin-bottom:0.35rem; font-weight:500; }
        input {
            width:100%; padding:0.65rem 0.85rem; border:1px solid #cbd5e1;
            border-radius:8px; font-size:0.95rem; margin-bottom:1rem;
        }
        input:focus { outline:none; border-color:#3b82f6; }
        button {
            width:100%; padding:0.75rem; background:#3b82f6; color:white;
            border:none; border-radius:8px; font-size:0.95rem; font-weight:600; cursor:pointer;
        }
        button:hover { background:#2563eb; }
        .err { background:#fee2e2; color:#991b1b; padding:0.65rem; border-radius:6px; font-size:0.85rem; margin-bottom:1rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>👨‍🏫 Teacher Login</h1>
        <p class="sub">Access your classes</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for cat, msg in messages %}
                <div class="err">{{ msg }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <label>Username</label>
            <input name="username" required autofocus>

            <label>Password</label>
            <input name="password" type="password" required>

            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
